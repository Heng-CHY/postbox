[package]
name = "postbox"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Self-hosted file delivery desk: turn any local file into a phone-friendly link with previews, downloads and a feedback inbox, driven by an agent over MCP"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "file-sharing", "mobile", "cloudflared", "ntfy"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
calamine = "0.36.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
pulldown-cmark = "0.9"
quick-xml = "0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["io-util"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true
