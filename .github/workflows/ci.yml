name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Format + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        run: cargo test

  build-binaries:
    name: Build release binary (${{ matrix.os }})
    needs: [lint, test]
    # 只给真正会留下产物的运行（push / 手动）编三平台，PR 不跑，省 CI 分钟数
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: postbox-linux-x86_64
          - os: macos-latest
            artifact: postbox-macos-aarch64
          - os: windows-latest
            artifact: postbox-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: cargo build --release
        run: cargo build --release
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: tar -C target/release -czf ${{ matrix.artifact }}.tar.gz postbox
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path target/release/postbox.exe -DestinationPath ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: warn

  github-release:
    name: Publish GitHub Release
    needs: [build-binaries]
    # 只有推 v* 标签才建 Release；日常 push 只留 Actions 临时产物
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: postbox-*
          merge-multiple: true
      - name: Create release and attach the three platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l postbox-*
          assets=$(ls postbox-*.tar.gz postbox-*.zip | tr '\n' ' ')
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" --title "postbox $GITHUB_REF_NAME" \
              --generate-notes $assets
          fi
