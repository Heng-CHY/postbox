name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Format + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        run: cargo test

  release:
    name: Build release binary (${{ matrix.os }})
    needs: [lint, test]
    # 只给真正会留下产物的运行（push / 手动）编三平台，PR 不跑，省 CI 分钟数
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: postbox-linux-x86_64
          - os: macos-latest
            artifact: postbox-macos-aarch64
          - os: windows-latest
            artifact: postbox-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: cargo build --release
        run: cargo build --release
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: tar -C target/release -czf ${{ matrix.artifact }}.tar.gz postbox
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path target/release/postbox.exe -DestinationName ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: warn
